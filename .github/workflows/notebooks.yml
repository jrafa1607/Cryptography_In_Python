name: Notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 9 * * 1"   # weekly: catches breakage from new library releases

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-notebooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check repository rules
        run: pytest -q tests
      - name: Execute every notebook (each one asserts its own results)
        run: pytest -q --nbmake --nbmake-timeout=300 Algorithms/
